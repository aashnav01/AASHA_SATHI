services:
  # One service serves both the API and the built React app, so the browser
  # talks to a single origin. That removes the need for a CORS allow-list and
  # for a build-time API URL - there is nothing to configure after the first
  # deploy, and only one instance to cold-start on the free plan.
  - type: web
    name: asha-sathi
    runtime: node
    plan: free
    # --include=dev is required: NODE_ENV=production below makes npm omit
    # devDependencies, and the build tools (vite, typescript, @types/node)
    # all live there. They are build-time only and are not needed at runtime.
    buildCommand: >-
      cd frontend && npm ci --include=dev && npm run build &&
      cd ../backend && npm ci --include=dev && npm run build
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.15.0
      - key: NODE_ENV
        value: production
      # Set these in the Render dashboard; sync:false keeps them out of git.
      - key: MONGODB_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Render generates a strong secret on first deploy.
      - key: JWT_SECRET
        generateValue: true
      # Optional - panic-button SMS falls back to console logging without them.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      # ALLOWED_ORIGIN and VITE_API_URL are deliberately absent: same origin
      # needs neither. Set them only if you later split the frontend out.
      #
      # To create a demo account without shell access, set SEED_ON_START=true
      # plus SEED_MOBILE and SEED_PIN in the dashboard, deploy, then unset
      # SEED_ON_START. It only runs against an empty database.
